spring.application.name=stataggregation

# automatic table creation and schema update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# declare oracle dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# kafka serialize java object to json
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# enable auto topic creation
spring.kafka.producer.properties.auto.create.topics.enable=true